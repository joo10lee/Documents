AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FeelFlow Backend - Serverless API
Globals:
  Function:
    Timeout: 20
    Runtime: nodejs18.x
    Environment:
      Variables:
        GEMINI_API_KEY:
          Ref: GeminiApiKey
  Api:
    Cors:
      AllowMethods: '''GET,POST,OPTIONS'''
      AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
      AllowOrigin: '''*'''
Parameters:
  GeminiApiKey:
    Type: String
    Description: API Key for Google Gemini
    NoEcho: true
Resources:
  FeelFlowTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: FeelFlowData
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
  PostEmotionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PostEmotionFunction
      Handler: postEmotion.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: FeelFlowTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /emotion
            Method: post
    Metadata:
      SamResourceId: PostEmotionFunction
  GetHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetHistoryFunction
      Handler: getHistory.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: FeelFlowTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /history
            Method: get
    Metadata:
      SamResourceId: GetHistoryFunction
  PostInsightFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PostInsightFunction
      Handler: postInsight.handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /ai/insight
            Method: post
    Metadata:
      SamResourceId: PostInsightFunction
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: OAI for FeelFlow Frontend
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: AllowCloudFrontOAI
          Effect: Allow
          Principal:
            CanonicalUser:
              Fn::GetAtt:
              - CloudFrontOAI
              - S3CanonicalUserId
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${FrontendBucket.Arn}/*
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
        - DomainName:
            Fn::GetAtt:
            - FrontendBucket
            - RegionalDomainName
          Id: S3Origin
          S3OriginConfig:
            OriginAccessIdentity:
              Fn::Sub: origin-access-identity/cloudfront/${CloudFrontOAI}
        Enabled: true
        DefaultRootObject: index.html
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          CachedMethods:
          - GET
          - HEAD
          - OPTIONS
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/
  CloudFrontURL:
    Description: Frontend URL (HTTPS)
    Value:
      Fn::GetAtt:
      - FrontendDistribution
      - DomainName
  S3BucketName:
    Description: S3 Bucket Name
    Value:
      Ref: FrontendBucket
