<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="FeelFlow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/api.js?v=2.5.2"></script>
    <script src="js/ui.js?v=2.5.2"></script>
    <script src="js/activities.js?v=2.5.2"></script>
    <script src="js/app.js?v=2.5.2"></script>

    <script>
        window.onload = function () {
            console.log("🚀 FeelFlow 인프라 Ver.0215-FINAL 가동");

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('🚀 SW Registered!'))
                    .catch(err => console.log('❌ SW fail:', err));
            }

            if (typeof initApp === 'function') {
                initApp();
            }
        };
    </script>
    <title>FeelFlow - Build Ver.0215-FINAL</title>
</head>

<body>
    <header class="app-header">
        <div class="header-status">
            <span id="weatherIcon">🌤️</span>
            <!-- 💡 Phase 2.5: Version Format (Date-Time) -->
            <span class="build-tag">Ver.0215-0157</span>
        </div>
        <div class="header-main">


            <!-- Dynamic Title Area -->
            <h1 id="headerTitle" class="greeting">Hey Jason, <br>how's it going?</h1>
        </div>
    </header>

    <!-- 💡 Phase 2.5: Floating Home Button (Next to Hamburger) -->
    <button id="navHomeBtn" class="nav-home-btn floating-home" onclick="goHome()" style="display:none;">🏠</button>

    <button class="hamburger-trigger" onclick="toggleMenu()">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </button>

    <div id="menuOverlay" class="menu-overlay">
        <button class="menu-close" onclick="toggleMenu()">×</button>
        <nav class="menu-content">
            <button class="menu-item" onclick="menuNavigate('Home', event)">🏠 Home</button>
            <button class="menu-item" onclick="menuNavigate('Routine', event)">✅ Routine</button>
            <button class="menu-item" onclick="menuNavigate('Trophies', event)">🏆 Trophies</button>
            <button class="menu-item" onclick="menuNavigate('History', event)">📅 My Journey</button>
            <button class="menu-item" onclick="menuNavigate('Settings', event)">⚙️ Settings</button>
        </nav>
    </div>

    <main class="screen active" id="screen1">


        <div class="emotion-bento">
            <button class="bento-card happy" onclick="selectEmotion('Happy', '😊', '#FFD93D')">
                <span class="emoji">😊</span> <span class="label">Happy</span>
            </button>
            <button class="bento-card sad" onclick="selectEmotion('Sad', '😢', '#6CB4EE')">
                <span class="emoji">😢</span> <span class="label">Sad</span>
            </button>
            <button class="bento-card anxious" onclick="selectEmotion('Anxious', '😰', '#A084E8')">
                <span class="emoji">😰</span> <span class="label">Anxious</span>
            </button>
            <button class="bento-card angry" onclick="selectEmotion('Angry', '😠', '#FF6B6B')">
                <span class="emoji">😠</span> <span class="label">Angry</span>
            </button>
            <button class="bento-card calm" onclick="selectEmotion('Calm', '😌', '#6BCB77')">
                <span class="emoji">😌</span> <span class="label">Calm</span>
            </button>
            <button class="bento-card tired" onclick="selectEmotion('Tired', '😫', '#95A5A6')">
                <span class="emoji">😫</span> <span class="label">Tired</span>
            </button>
        </div>

        <div class="quick-mission-section">
            <h3 class="section-title">Daily Quest ⚔️</h3>
            <div id="quickTaskListContainer" style="overflow-y: auto; max-height: calc(100vh - 450px);">
                <div id="quickTaskList" class="quick-task-grid"></div>
            </div>
        </div>
    </main>

    <main class="screen" id="screen2">
        <div class="intensity-screen">
            <div class="intensity-card">
                <div id="selectedEmoji" style="font-size: 5rem;">😊</div>
                <div id="selectedName" style="font-size: 1.5rem; font-weight: 850;">Happy</div>
                <p style="margin-top: 20px; color: #64748b;">How strong is this feeling?</p>
                <div class="intensity-display" id="intensityDisplay">5</div>
                <input type="range" min="1" max="10" value="5" class="intensity-slider" id="intensitySlider"
                    oninput="updateIntensity(this.value)">
                <div class="slider-labels">
                    <span>Mild</span>
                    <span>Strong</span>
                </div>
            </div>
            <button class="btn-primary" onclick="goToResult()">Next</button>
            <button class="btn-secondary" onclick="UI.back()">← Back</button>
        </div>
    </main>

    <main class="screen" id="screen4">
        <div class="result-summary-bar" id="resultSummaryBar">
            <span id="summaryEmoji"></span>
            <span id="summaryText"></span>
        </div>
        <div id="strategiesContainer"></div>
        <div class="strategies-footer">
            <button class="btn btn-secondary" onclick="UI.back()">← Back</button>
        </div>
    </main>

    <main class="screen" id="screen5">
        <div class="result-card">
            <div class="result-emoji">✨</div>
            <p style="font-size: 1.4rem; font-weight: 800;">Great job, Jason!</p>
            <p id="finalMessage">Mission Recorded Successfully.</p>
            <button class="btn-primary" onclick="startOver()">Finish</button>
        </div>
    </main>

    <main class="screen" id="screenActivity">
        <div class="activity-container">
            <div class="activity-header">
                <div class="activity-icon" id="activityIcon">🧸</div>
                <h2 id="activityTitle">Activity</h2>
            </div>
            <div id="inAppActionArea"></div>
            <div class="activity-footer">
                <button class="btn-primary" id="activityBtn" style="display:none;">Save Mission</button>
                <button class="btn btn-secondary" onclick="UI.back()">← Back</button>
            </div>
        </div>
    </main>

    <main class="screen" id="screenTrophies">
        <div class="history-container">
            <h2 class="section-title" style="text-align:center;">Trophy Room</h2>
            <div id="trophyContent"></div>
        </div>
    </main>

    <main class="screen" id="screenJourney">
        <div class="history-container">
            <h2 class="section-title" style="text-align:center;">My Journey</h2>
            <div id="historyList"></div>
        </div>
    </main>

    <main class="screen" id="screenTracker">
        <div class="tracker-container">
            <div class="tracker-tabs">
                <button class="tracker-tab active" id="tabMorning" onclick="switchRoutine('morning')">🌅
                    Morning</button>
                <button class="tracker-tab" id="tabEvening" onclick="switchRoutine('evening')">🌙 Evening</button>
            </div>
            <div class="progress-card">
                <div class="progress-header">
                    <span id="progressTitle" style="font-weight:850;">Jason's Routine</span>
                    <span id="progressFraction" style="color:#7c3aed; font-weight:850;">0/0</span>
                </div>
                <div class="progress-bar-container">
                    <div id="progressBar" class="progress-bar-fill"></div>
                </div>
            </div>
            <div id="taskList"></div>

        </div>
    </main>
</body>

</html>
